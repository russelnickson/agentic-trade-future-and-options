name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/

  deploy-to-aws-ec2:
    name: deploy-to-aws-ec2
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID secret is empty"
            exit 1
          fi
          if [[ -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY secret is empty"
            exit 1
          fi
          if [[ ! "${AWS_ACCESS_KEY_ID}" =~ ^AKIA[0-9A-Z]{16}$ ]]; then
            echo "::error::AWS_ACCESS_KEY_ID looks invalid (expected AKIA… IAM user key; no quotes/spaces)"
            exit 1
          fi
          echo "AWS access key secrets present (key id suffix …${AWS_ACCESS_KEY_ID: -4})"

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate EC2 SSH secrets
        id: ec2
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USERNAME }}
          RAW_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${RAW_HOST}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//' -e 's#^https\?://##' -e 's#/$##')"
          USER="$(printf '%s' "${RAW_USER}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')"
          KEY="$(printf '%s' "${RAW_KEY}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${HOST}" ]]; then
            echo "::error::EC2_HOST secret is empty (set Elastic IP or public DNS, no quotes)"
            exit 1
          fi
          if [[ -z "${USER}" ]]; then
            echo "::error::EC2_USERNAME secret is empty (expected ubuntu)"
            exit 1
          fi
          if [[ -z "${KEY}" ]]; then
            echo "::error::EC2_SSH_KEY secret is empty (paste full PEM including BEGIN/END lines)"
            exit 1
          fi
          if ! printf '%s\n' "${KEY}" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::EC2_SSH_KEY does not look like a PEM private key"
            exit 1
          fi
          {
            echo "host=${HOST}"
            echo "username=${USER}"
          } >> "${GITHUB_OUTPUT}"
          # Multiline key for ssh-action
          {
            echo "key<<EOF"
            printf '%s\n' "${KEY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "EC2 SSH secrets OK (host=${HOST}, user=${USER})"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ steps.ec2.outputs.host }}
          username: ${{ steps.ec2.outputs.username }}
          key: ${{ steps.ec2.outputs.key }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/app"
            REPO_SSH="git@github.com:russelnickson/agentic-trade-future-and-options.git"

            mkdir -p "$(dirname "$APP_DIR")"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_SSH" || true
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            else
              git clone --branch main "$REPO_SSH" "$APP_DIR"
              cd "$APP_DIR"
            fi

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            # shellcheck disable=SC1091
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            pm2 restart fno-worker || pm2 start "uvicorn execution_worker.main:app --host 0.0.0.0 --port 8000" --name "fno-worker"
            pm2 save
