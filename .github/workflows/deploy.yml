name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/

  deploy-to-aws-ec2:
    name: deploy-to-aws-ec2
    needs: test-and-lint
    runs-on: ubuntu-latest
    # Do NOT set `environment:` here unless the IAM trust `sub` allows
    # `repo:russelnickson/agentic-trade-future-and-options:environment:<name>`.
    # With `environment: production`, GitHub issues a different OIDC subject than
    # `ref:refs/heads/main` and AssumeRoleWithWebIdentity fails.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS_ROLE_ARN
        id: aws_role
        env:
          RAW_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          ARN="$(printf '%s' "${RAW_ARN}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')"
          if [[ -z "${ARN}" ]]; then
            echo "::error::AWS_ROLE_ARN secret is empty"
            exit 1
          fi
          if [[ ! "${ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN must be a full role ARN like arn:aws:iam::123456789012:role/github-actions-fno-deploy (got invalid format; check quotes/spaces/newlines in the secret)"
            exit 1
          fi
          echo "arn=${ARN}" >> "${GITHUB_OUTPUT}"
          echo "AWS_ROLE_ARN format OK (account …${ARN:13:4}… role suffix hidden)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws_role.outputs.arn }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: gha-fno-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/ubuntu/app"
            REPO_SSH="git@github.com:russelnickson/agentic-trade-future-and-options.git"

            mkdir -p "$(dirname "$APP_DIR")"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_SSH" || true
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            else
              git clone --branch main "$REPO_SSH" "$APP_DIR"
              cd "$APP_DIR"
            fi

            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            # shellcheck disable=SC1091
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            pm2 restart fno-worker || pm2 start "uvicorn execution_worker.main:app --host 0.0.0.0 --port 8000" --name "fno-worker"
            pm2 save
