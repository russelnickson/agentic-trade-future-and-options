name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/

  deploy-to-aws-ec2:
    name: deploy-to-aws-ec2
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID secret is empty"
            exit 1
          fi
          if [[ -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY secret is empty"
            exit 1
          fi
          if [[ ! "${AWS_ACCESS_KEY_ID}" =~ ^AKIA[0-9A-Z]{16}$ ]]; then
            echo "::error::AWS_ACCESS_KEY_ID looks invalid (expected AKIA… IAM user key; no quotes/spaces)"
            exit 1
          fi
          echo "AWS access key secrets present (key id suffix …${AWS_ACCESS_KEY_ID: -4})"

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate EC2 SSH secrets
        id: ec2
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USERNAME }}
          RAW_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${RAW_HOST}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//' -e 's#^https\?://##' -e 's#/$##')"
          USER="$(printf '%s' "${RAW_USER}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')"
          KEY="$(printf '%s' "${RAW_KEY}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${HOST}" ]]; then
            echo "::error::EC2_HOST secret is empty (set Elastic IP or public DNS, no quotes)"
            exit 1
          fi
          if [[ -z "${USER}" ]]; then
            echo "::error::EC2_USERNAME secret is empty (expected ubuntu)"
            exit 1
          fi
          if [[ -z "${KEY}" ]]; then
            echo "::error::EC2_SSH_KEY secret is empty (paste full PEM including BEGIN/END lines)"
            exit 1
          fi
          if ! printf '%s\n' "${KEY}" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::EC2_SSH_KEY does not look like a PEM private key"
            exit 1
          fi
          {
            echo "host=${HOST}"
            echo "username=${USER}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "key<<EOF"
            printf '%s\n' "${KEY}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "EC2 SSH secrets OK (host=${HOST}, user=${USER})"

      - name: Deploy to EC2 (rsync + portal + worker)
        env:
          EC2_HOST: ${{ steps.ec2.outputs.host }}
          EC2_USERNAME: ${{ steps.ec2.outputs.username }}
          EC2_SSH_KEY: ${{ steps.ec2.outputs.key }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/fno-ec2-key.pem"
          printf '%s\n' "${EC2_SSH_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          SSH=(ssh -i "${KEY_FILE}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          RSYNC_SSH="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          APP_DIR="/home/ubuntu/app"
          REMOTE="${EC2_USERNAME}@${EC2_HOST}"

          echo "==> bootstrap packages on ${REMOTE}"
          "${SSH[@]}" "${REMOTE}" bash -s <<'REMOTE_BOOTSTRAP'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 python3-pip python3-venv git curl rsync redis-server
          sudo systemctl enable redis-server
          sudo systemctl start redis-server || sudo service redis-server start || true
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install -g pm2
          fi
          mkdir -p /home/ubuntu/app
          REMOTE_BOOTSTRAP

          echo "==> rsync workspace -> ${REMOTE}:${APP_DIR}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pem' \
            --exclude '.env' \
            --exclude '.secrets.env' \
            -e "${RSYNC_SSH}" \
            ./ "${REMOTE}:${APP_DIR}/"

          echo "==> install deps + start FastAPI worker + Streamlit portal"
          "${SSH[@]}" "${REMOTE}" bash -s <<'REMOTE_INSTALL'
          set -euo pipefail
          APP_DIR="/home/ubuntu/app"
          cd "$APP_DIR"
          if [ ! -d venv ]; then
            python3 -m venv venv
          fi
          # shellcheck disable=SC1091
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          if [ ! -f .env ]; then
            umask 077
            printf '%s\n' \
              'REDIS_URL=redis://127.0.0.1:6379/0' \
              'EC2_HOST=127.0.0.1' \
              'EC2_ELASTIC_IP=127.0.0.1' \
              'PAPER_TRADING=true' \
              'BROKER_NAME=dhan' \
              'INTERNAL_AUTH_SECRET=change-me-set-in-ec2-dotenv' \
              'STREAMLIT_SERVER_ADDRESS=0.0.0.0' \
              'STREAMLIT_SERVER_PORT=8501' \
              > .env
          fi
          grep -q '^REDIS_URL=' .env || echo 'REDIS_URL=redis://127.0.0.1:6379/0' >> .env
          grep -q '^EC2_HOST=' .env || echo 'EC2_HOST=127.0.0.1' >> .env
          grep -q '^EC2_ELASTIC_IP=' .env || echo 'EC2_ELASTIC_IP=127.0.0.1' >> .env
          grep -q '^STREAMLIT_SERVER_PORT=' .env || echo 'STREAMLIT_SERVER_PORT=8501' >> .env
          grep -q '^STREAMLIT_SERVER_ADDRESS=' .env || echo 'STREAMLIT_SERVER_ADDRESS=0.0.0.0' >> .env

          pm2 delete fno-worker >/dev/null 2>&1 || true
          pm2 delete streamlit_dashboard >/dev/null 2>&1 || true

          pm2 start "venv/bin/uvicorn execution_worker.main:app --host 0.0.0.0 --port 8000" \
            --name "fno-worker" --cwd "$APP_DIR"
          pm2 start workers/streamlit_dashboard.py \
            --name "streamlit_dashboard" \
            --interpreter "$APP_DIR/venv/bin/python" \
            --cwd "$APP_DIR"
          pm2 save
          pm2 status
          curl -sf -m 5 http://127.0.0.1:8000/health || true
          curl -sf -m 5 -o /dev/null -w "portal_http=%{http_code}\n" http://127.0.0.1:8501/ || true
          echo "==> deploy OK — portal at http://HOST:8501 (SG must allow TCP 8501)"
          REMOTE_INSTALL
